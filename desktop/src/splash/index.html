<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; object-src 'none'" />
    <title>冷咖啡 · 启动中</title>
    <link rel="stylesheet" href="splash.css" />
  </head>
  <body>
    <main class="launch-screen" aria-label="冷咖啡工作台正在启动">
      <div class="grid-lines" aria-hidden="true"></div>
      <div class="signal signal-a" aria-hidden="true"></div><div class="signal signal-b" aria-hidden="true"></div><div class="signal signal-c" aria-hidden="true"></div>
      <section class="launch-mark">
        <div class="mark-ring"><span>冷</span></div>
        <p class="brand-cn">冷咖啡</p>
        <p class="brand-en">COLDBREW COMMAND CENTER</p>
      </section>
      <section class="launch-status"><span class="status-dot"></span><span>加载 MAXIMUM CORE</span><span class="status-code">V5.0 / LOCAL</span></section>
      <p class="launch-caption">目标 · 路由 · 产物 · 验证 · 恢复</p>
    </main>
  </body>
</html>
