name: desktop

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"
      - "打开冷咖啡.command"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            pack: pack:win
            artifact: win
          - os: macos-latest
            pack: pack:mac
            artifact: mac
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run ${{ matrix.pack }}
      - uses: actions/upload-artifact@v4
        with:
          name: coldbrew-${{ matrix.artifact }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.zip
          if-no-files-found: warn
